spring.application.name: chat-service
server:
  port: 9090
  servlet:
    context-path: /api/v1/chats
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    prefer-ip-address: true
spring:
  datasource:
    url: jdbc:postgresql://localhost:9000/linkedin_chat_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update