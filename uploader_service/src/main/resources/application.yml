spring:
  application:
    name: uploader-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 9050
  servlet:
    context-path: /api/v1/uploads

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

cloudinary:
  api-key: ${API_KEY}
  cloud-name: ${CLOUD_NAME}
  api-secret: ${API_SECRET}